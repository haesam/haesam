<script>

	const container = bm.container;

	const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
	// 입력 구간 [i1, i2]의 진행도를 출력 구간 [o1, o2]로 매핑 (구간 밖은 클램프)
	const remap = (v, i1, i2, o1, o2) => {
		if (i1 === i2) return o2;
		return o1 + (o2 - o1) * clamp((v - i1) / (i2 - i1), 0, 1);
	};

	// 동심원 스케일 타임라인: [시작, 끝] 진행도 / [시작, 끝] 스케일 / 페이드아웃 구간
	const CIRCLE_ANIM = [
		{ start: 0.03, end: 0.55, from: 0.50, to: 5.0, fade: null },
		{ start: 0.10, end: 0.60, from: 0.35, to: 4.0, fade: [0.35, 0.50] },
		{ start: 0.15, end: 0.62, from: 0.25, to: 3.2, fade: [0.38, 0.52] },
		{ start: 0.20, end: 0.64, from: 0.18, to: 2.6, fade: [0.40, 0.54] }
	];

	let els = null;
	let ticking = false;

	function cacheEls() {
		els = {
			nav: container.querySelector('.ob-nav'),
			hero: container.querySelector('.ob-hero'),
			heroSticky: container.querySelector('.ob-hero-sticky'),
			circles: Array.prototype.slice.call(container.querySelectorAll('.ob-circle')),
			letters: container.querySelector('.ob-letters'),
			content1: container.querySelector('.ob-hero-content-1'),
			content2: container.querySelector('.ob-hero-content-2'),
			services: container.querySelector('.ob-services'),
			cards: Array.prototype.slice.call(container.querySelectorAll('.ob-card'))
		};
	}

	function updateHero(vh) {
		if (!els.hero || !els.heroSticky) return;
		const rect = els.hero.getBoundingClientRect();
		const total = Math.max(rect.height - vh, 1);
		const p = clamp(-rect.top / total, 0, 1);

		// 마지막 25% 구간: 축소 + 라운딩 + 페이드아웃
		const exit = remap(p, 0.75, 1, 0, 1);
		els.heroSticky.style.transform = 'translateY(' + (-8 * exit) + 'vh) scale(' + (1 - 0.3 * exit) + ')';
		els.heroSticky.style.borderRadius = (60 * exit) + 'px';
		els.heroSticky.style.opacity = String(1 - exit);

		// 동심원 스케일 업
		els.circles.forEach((c, i) => {
			const a = CIRCLE_ANIM[i];
			if (!a) return;
			c.style.transform = 'scale(' + remap(p, a.start, a.end, a.from, a.to) + ')';
			if (a.fade) c.style.opacity = String(remap(p, a.fade[0], a.fade[1], 1, 0));
		});

		// B [O] X 타이포: 초반 5%에서 페이드아웃
		if (els.letters) els.letters.style.opacity = String(remap(p, 0, 0.05, 1, 0));

		// 콘텐츠 1: 등장 후 퇴장
		if (els.content1) {
			const o = Math.min(remap(p, 0.15, 0.22, 0, 1), remap(p, 0.38, 0.45, 1, 0));
			els.content1.style.opacity = String(o);
			els.content1.style.transform = 'translateY(' + (remap(p, 0.15, 0.22, 50, 0) + remap(p, 0.38, 0.45, 0, -50)) + 'px)';
		}

		// 콘텐츠 2: 등장 후 유지
		if (els.content2) {
			const o = remap(p, 0.45, 0.58, 0, 1);
			els.content2.style.opacity = String(o);
			els.content2.style.transform = 'translateY(' + remap(p, 0.45, 0.58, 50, 0) + 'px)';
			els.content2.style.pointerEvents = o > 0.5 ? 'auto' : 'none';
		}
	}

	function updateServices(vh) {
		if (!els.services || !els.cards.length) return;
		const rect = els.services.getBoundingClientRect();
		const total = Math.max(rect.height - vh, 1);
		const q = clamp(-rect.top / total, 0, 1);
		const n = els.cards.length;
		const seg = n > 1 ? 0.9 / (n - 1) : 1;

		// 각 카드의 등장 진행도 (첫 카드는 항상 등장 완료)
		const enters = els.cards.map((_, i) => {
			if (i === 0) return 1;
			const s = 0.05 + (i - 1) * seg;
			return remap(q, s, s + seg * 0.8, 0, 1);
		});

		els.cards.forEach((card, i) => {
			const y = (1 - enters[i]) * 110;
			let covered = 0;
			for (let j = i + 1; j < n; j++) covered += enters[j];
			card.style.transform = 'translateY(' + y + '%) scale(' + (1 - 0.05 * covered) + ')';
		});
	}

	function update() {
		ticking = false;
		if (!els) return;
		const vh = window.innerHeight || 1;
		if (els.nav) els.nav.classList.toggle('is-scrolled', (window.scrollY || 0) > 50);
		updateHero(vh);
		updateServices(vh);
	}

	function requestTick() {
		if (!ticking) {
			ticking = true;
			requestAnimationFrame(update);
		}
	}

	function setActiveFolio(item) {
		container.querySelectorAll('.ob-folio-item').forEach(el => {
			el.classList.toggle('active', el === item);
		});
	}

	function toggleMenu(open) {
		const menu = container.querySelector('.ob-mobile-menu');
		if (!menu) return;
		menu.classList.toggle('open', open);
		document.body.style.overflow = open ? 'hidden' : '';
	}

	container.addEventListener('click', (e) => {
		const actionEl = e.target.closest('[data-action]');
		if (actionEl) {
			if (actionEl.dataset.action === 'open-menu') {
				e.preventDefault();
				return toggleMenu(true);
			}
			if (actionEl.dataset.action === 'close-menu') toggleMenu(false);
		}

		// 포트폴리오: 비활성 항목 첫 클릭은 활성화만 (터치 대응)
		const folio = e.target.closest('.ob-folio-item');
		if (folio && !folio.classList.contains('active')) {
			e.preventDefault();
			return setActiveFolio(folio);
		}

		// 블록 내부 앵커는 부드럽게 스크롤
		const anchor = e.target.closest('a[href^="#"]');
		if (anchor) {
			const href = anchor.getAttribute('href');
			if (href === '#') return e.preventDefault();
			let target = null;
			try { target = container.querySelector(href); } catch (err) { target = null; }
			if (target) {
				e.preventDefault();
				target.scrollIntoView({ behavior: 'smooth' });
			}
		}
	}, true);

	// 포트폴리오: 데스크톱 호버 / 키보드 포커스 시 확장
	container.addEventListener('mouseover', (e) => {
		if (!window.matchMedia('(hover: hover)').matches) return;
		const folio = e.target.closest('.ob-folio-item');
		if (folio) setActiveFolio(folio);
	});
	container.addEventListener('focusin', (e) => {
		const folio = e.target.closest('.ob-folio-item');
		if (folio) setActiveFolio(folio);
	});

	const onScroll = () => requestTick();
	const onResize = () => requestTick();
	window.addEventListener('scroll', onScroll, { passive: true });
	window.addEventListener('resize', onResize);

	// 에디터 프리뷰: 설정 변경으로 재렌더링되면 요소 캐시 갱신
	bm.onContextChange = () => {
		cacheEls();
		requestTick();
	};

	bm.onDestroy = () => {
		window.removeEventListener('scroll', onScroll);
		window.removeEventListener('resize', onResize);
		document.body.style.overflow = '';
	};

	cacheEls();
	update();

</script>
