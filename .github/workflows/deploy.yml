name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/personal-brand-coach-page-pam2dc]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      # 기존에 배포돼 있던 커리어랩 사이트(루트)를 보존하고,
      # 유미 코치 랜딩은 /yumi-coach/ 하위 경로로 함께 배포한다
      - name: Compose site tree
        run: |
          mkdir -p site
          git fetch origin 04750d8ccc6712f15b7d4270bacae5cd0bdc8bee
          git --work-tree=site checkout 04750d8ccc6712f15b7d4270bacae5cd0bdc8bee -- .
          mkdir -p site/yumi-coach
          cp -r dist/* site/yumi-coach/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
